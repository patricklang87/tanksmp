spring.application.name=tanksmp
server.port=${PORT:8080}
# Comma-separated list of extra origins allowed to call the API cross-origin.
# Same-origin requests (the bundled client) are always allowed, provided server.forward-headers-strategy
# below is set so the origin check sees the public https host.
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}
# Makes Spring trust Render's X-Forwarded-* headers so same-origin checks see the https origin.
server.forward-headers-strategy=framework
# Matches with no activity for this long are deleted (ISO-8601 duration, e.g. PT1H for one hour).
app.match-idle-timeout=${MATCH_IDLE_TIMEOUT:PT1H}
app.match-cleanup-interval=PT5M
